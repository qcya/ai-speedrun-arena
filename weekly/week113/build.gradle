plugins {
    id 'fabric-loom' version '1.8.13'
}
group = 'dev.aiarena'
version = '0.1.0'

dependencies {
    minecraft 'com.mojang:minecraft:1.16.1'
    mappings 'net.fabricmc:yarn:1.16.1+build.21:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
}
sourceSets.main.java {
    srcDir '../week29/src/main/java'
    include 'dev/aiarena/week113/**', 'dev/aiarena/week29/VisibleSlots.java', 'dev/aiarena/week29/mixin/HandledScreenPosition.java'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}
loom.mixin.defaultRefmapName = 'astra113-refmap.json'
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
